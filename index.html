<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小灯笼 · The Lantern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#132329;
  --ink-2:#1B333B;
  --ink-3:#24444E;
  --paper:#F6EFDD;
  --paper-2:#EADFC4;
  --lantern:#F0AF3C;
  --lantern-dim:#8A6425;
  --seal:#BE4436;
  --jade:#6FA089;
  --line:rgba(246,239,221,.14);
  --muted:rgba(246,239,221,.52);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:"Newsreader",Georgia,serif;
  font-size:17px;line-height:1.55;
  min-height:100dvh;
  padding:0 20px 48px;
  max-width:520px;margin:0 auto;
  background-image:radial-gradient(120% 55% at 50% 0%, rgba(240,175,60,.13) 0%, rgba(240,175,60,0) 62%);
}
.zh{font-family:"Noto Serif SC","Newsreader",serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.hidden{display:none !important}

/* ---------- lantern signature ---------- */
header{padding:26px 0 6px;text-align:center}
#lantern{width:96px;height:126px;display:block;margin:0 auto}
.rib{transition:opacity .5s ease, fill .5s ease}
.glow{transition:opacity .7s ease}
h1{
  font-family:"Noto Serif SC",serif;font-weight:600;
  font-size:27px;letter-spacing:.16em;margin:14px 0 2px;
}
.sub{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;
}

/* ---------- shared ---------- */
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--muted);
}
.panel{
  background:var(--ink-2);border:1px solid var(--line);
  border-radius:3px;padding:18px 18px 20px;margin:14px 0;
}
.btn{
  display:block;width:100%;text-align:left;
  background:var(--ink-2);border:1px solid var(--line);
  border-radius:3px;padding:15px 17px;margin:9px 0;
  transition:background .18s ease,border-color .18s ease;
}
.btn:hover,.btn:focus-visible{background:var(--ink-3);border-color:rgba(240,175,60,.4)}
.btn b{display:block;font-weight:600;font-size:17.5px}
.btn span{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.btn-lantern{background:var(--lantern);color:#20160A;border-color:var(--lantern)}
.btn-lantern:hover,.btn-lantern:focus-visible{background:#F7BE58;border-color:#F7BE58}
.btn-lantern span{color:rgba(32,22,10,.7)}
.btn-jade{background:var(--jade);color:#08160F;border-color:var(--jade)}
.btn-jade:hover,.btn-jade:focus-visible{background:#7FB199;border-color:#7FB199}
.btn-jade span{color:rgba(8,22,15,.72)}
.row{display:flex;gap:9px}
.row>button{flex:1;text-align:center}
:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}

/* ---------- card ---------- */
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.toggle-label{font-size:15.5px;font-weight:600}
.toggle-label small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:2px}
.switch{position:relative;width:46px;height:26px;flex:0 0 46px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--ink-3);border:1px solid var(--line);border-radius:26px;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:var(--paper);border-radius:50%;transition:.2s}
input:checked + .slider{background:var(--lantern);border-color:var(--lantern)}
input:checked + .slider:before{transform:translateX(20px);background:#20160A}
.progress{display:flex;gap:5px;justify-content:center;margin:20px 0 22px}
.pip{width:26px;height:2px;background:rgba(246,239,221,.18)}
.pip.on{background:var(--lantern)}
.pip.miss{background:var(--seal)}

.card{
  background:var(--paper);color:#20160A;
  border-radius:3px;padding:34px 22px;text-align:center;
  min-height:236px;display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 18px 44px rgba(0,0,0,.34);
}
.pool{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:rgba(32,22,10,.5);margin-bottom:20px;
}
.prompt{
  font-family:"Noto Serif SC",serif;font-weight:600;
  font-size:46px;line-height:1.32;letter-spacing:.05em;
}
.prompt.small{font-size:26px;letter-spacing:.02em;line-height:1.55}
.reveal{border-top:1px solid rgba(32,22,10,.16);margin-top:22px;padding-top:18px}
.answer{font-family:"Noto Serif SC",serif;font-weight:600;font-size:34px;letter-spacing:.05em}
.pinyin{font-family:"IBM Plex Mono",monospace;font-size:15px;color:#8A5A18;margin-top:9px;letter-spacing:.04em}
.english{font-size:17px;color:rgba(32,22,10,.72);margin-top:5px;font-style:italic}
.tip{font-size:14.5px;color:rgba(32,22,10,.6);margin-top:14px;line-height:1.5}

.tapline{text-align:center;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;margin-top:18px}
.miss-btn{border-color:rgba(190,68,54,.5)}
.miss-btn:hover{background:rgba(190,68,54,.16);border-color:var(--seal)}

/* ---------- lists ---------- */
.item{border-bottom:1px solid var(--line);padding:12px 0;display:flex;align-items:baseline;gap:12px}
.item:last-child{border-bottom:none}
.item .h{font-family:"Noto Serif SC",serif;font-size:20px;font-weight:600;min-width:96px}
.item .m{font-size:14px;color:var(--muted)}
select,textarea{
  width:100%;background:var(--ink);color:var(--paper);
  border:1px solid var(--line);border-radius:3px;padding:11px;font:inherit;font-size:15px;
}
input[type="text"]{
  width:100%;background:var(--ink);color:var(--paper);
  border:1px solid var(--line);border-radius:3px;padding:11px;font:inherit;font-size:15px;
}
textarea{font-family:"IBM Plex Mono",monospace;font-size:11.5px;min-height:120px}
.stage-rail{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:18px 0 20px}
.stage-step{height:4px;background:rgba(246,239,221,.16);border-radius:4px}
.stage-step.on{background:var(--lantern)}
.stage-step.done{background:var(--jade)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.choice{margin:0;text-align:center;min-height:66px;display:flex;align-items:center;justify-content:center}
.choice b{font-family:"Noto Serif SC",serif;font-size:23px}
.choice.good{border-color:var(--jade);background:rgba(111,160,137,.18)}
.choice.bad{border-color:var(--seal);background:rgba(190,68,54,.14)}
.format-help{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:8px}
.stage-name{text-align:center;color:var(--lantern);margin:0 0 8px}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.score-cell{background:var(--ink);border:1px solid var(--line);padding:10px;border-radius:3px;text-align:center}
.score-cell b{display:block;color:var(--lantern);font-size:21px}
p{margin:9px 0}
.dim{color:var(--muted);font-size:14.5px}
.big-zh{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:600;text-align:center;letter-spacing:.06em;margin:8px 0 4px;color:var(--lantern)}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<header>
  <svg id="lantern" viewBox="0 0 96 126" aria-hidden="true">

    <rect x="30" y="102" width="36" height="6" rx="1" fill="var(--paper-2)"/>
    <line x1="48" y1="2" x2="48" y2="12" stroke="var(--paper-2)" stroke-width="1.5"/>
    <path d="M48 108 L48 118 M44 118 L52 118 L48 126 Z" stroke="var(--seal)" stroke-width="1.5" fill="var(--seal)"/>
    <g id="ribs">
      <path class="rib" d="M30 18 Q10 60 30 102" fill="none" stroke="var(--lantern-dim)" stroke-width="2"/>
      <path class="rib" d="M39 18 Q29 60 39 102" fill="none" stroke="var(--lantern-dim)" stroke-width="2"/>
      <path class="rib" d="M48 18 L48 102" fill="none" stroke="var(--lantern-dim)" stroke-width="2"/>

    </g>
  </svg>
  <h1 class="zh">小灯笼</h1>
  <p class="sub">The Lantern</p>
</header>

<main id="app"></main>

<script>
/* ============================================================

   Five cards. Five minutes. One sentence out loud.
   Deck seeded from 《欢乐伙伴》3A (L1–L9) and 3B (L10–L17).
   ============================================================ */

const LESSONS = [
  {id:1, book:"3A", title:"美丽的愿望"},
  {id:2, book:"3A", title:"我的朋友和家人"},

  {id:10,book:"3B", title:"我住的地方真干净"},
  {id:11,book:"3B", title:"环保小天使"},
  {id:12,book:"3B", title:"我爱新加坡"},
  {id:13,book:"3B", title:"寻路大挑战"},
  {id:14,book:"3B", title:"奇妙的动物"},
  {id:15,book:"3B", title:"华文真有趣"},
  {id:16,book:"3B", title:"学习要认真"},
  {id:17,book:"3B", title:"好孩子"}
];

const POOL_LABEL = {ci:"词语", da:"词语搭配", zao:"造句", guan:"关联词", cheng:"成语"};

/* w = 词语: front characters only, reveal pinyin + English
   d = 搭配: front is the collocation with a gap
   z = 造句: front is the instruction, reveal is a model sentence
   g = 关联词: front is a sentence with a gap                     */

   to it, so an id is never regenerated, renumbered or reordered — inserting,
   deleting or copy-editing a card must leave every other id untouched. */
function w(id,l,c,p,e){return{id,l,pool:"ci",front:c,ans:c,py:p,en:e};}
function d(id,l,front,ans,p,e){return{id,l,pool:"da",front,ans,py:p,en:e};}
function z(id,l,word,p,e,model){return{id,l,pool:"zao",front:"用「"+word+"」造句",ans:word,py:p,en:e,tip:model};}
function g(id,l,front,ans,p,e){return{id,l,pool:"guan",front,ans,py:p,en:e};}
function ch(id,word,p,e){return{id,l:0,pool:"cheng",front:word,ans:word,py:p,en:e,stretch:true};}

const DECK = [
  /* ---------- 3A ---------- */
  w("3A-L01-CI-YUANWANG", 1, "愿望", "yuàn wàng", "a wish, an aspiration"),

  w("3A-L01-CI-JIANGLAI", 1, "将来", "jiāng lái", "the future"),

  w("3A-L02-CI-XINGMING", 2, "姓名", "xìng míng", "full name"),

  w("3A-L03-CI-HUOBAN", 3, "伙伴", "huǒ bàn", "companion, partner"),

  w("3A-L03-CI-XIGUAN", 3, "习惯", "xí guàn", "a habit; to be used to"),

  w("3A-L04-CI-BIANHUA", 4, "变化", "biàn huà", "change"),

  w("3A-L06-CI-YUANLIANG", 6, "原谅", "yuán liàng", "to forgive"),

  w("3A-L06-CI-TURAN", 6, "突然", "tū rán", "suddenly"),

  d("3B-L10-DA-BAOCHIGANJING", 10, "保持＿＿", "干净", "bǎo chí gān jìng", "to keep something clean"),

  w("3B-L11-CI-LANGFEI", 11, "浪费", "làng fèi", "to waste"),

function schoolHomeworkDecks(){
  return HW_SCHOOL_SEEDS.map(seed=>{
    const tag=String(seed.lesson).padStart(2,"0");
    return {id:`HWD-SCHOOL-L${tag}`,title:seed.title,lesson:seed.lesson,source:"school",preloaded:true,
      createdAt:"2026-09-17T00:00:00.000Z",
      items:seed.rows.map(r=>{const [char,py,en,word,sentence]=r;return {id:`HW-SCHOOL-L${tag}-${char}`,char,py,en,word,sentence};})};
  });
}
function mergeHomeworkLibrary(h){
  if(!h||typeof h!=="object")h={decks:[],activeId:null,evidence:{},runs:[]};
  if(!Array.isArray(h.decks))h.decks=[];
  if(!h.evidence||typeof h.evidence!=="object")h.evidence={};
  if(!Array.isArray(h.runs))h.runs=[];
  const seeds=schoolHomeworkDecks(), seedIds=new Set(seeds.map(d=>d.id));
  const existing=new Map(h.decks.map(d=>[d&&d.id,d]));
  const school=seeds.map(seed=>{
    const old=existing.get(seed.id);
    return old?{...old,...seed,items:seed.items}:seed;
  });
  const custom=h.decks.filter(d=>d&&d.id&&!seedIds.has(d.id)).map(d=>({...d,source:d.source||"custom",preloaded:false,items:(d.items||[]).map(x=>x.char?x:{...x,char:x.word})}));
  h.decks=[...school,...custom];
  if(h.activeId&&!h.decks.some(d=>d.id===h.activeId))h.activeId=null;
  return h;
}

/* ---------------- storage ---------------- */
const KEY="lantern.v2";   /* v2: positional ids retired for stable ids */
let mem=null, canPersist=true;
/* cards/misses  = recognition evidence (SRS box/due/seen/missed)
   prod/pmisses  = character-production evidence. Deliberately separate:
   "I recognised 愿望" and "I wrote 愿望 from pinyin" are different claims. */
const blankHomework=()=>mergeHomeworkLibrary({decks:[],activeId:null,evidence:{},runs:[]});
const blank=()=>({session:0,lesson:12,cards:{},misses:[],lastDate:null,streak:0,
                  prod:{},pmisses:[],prodRuns:0,homework:blankHomework()});
function hydrate(s){
  if(!s.prod)s.prod={}; if(!Array.isArray(s.pmisses))s.pmisses=[];
  if(!Number.isFinite(s.prodRuns))s.prodRuns=0;
  if(!s.homework||typeof s.homework!=="object")s.homework=blankHomework();
  s.homework=mergeHomeworkLibrary(s.homework);
  return s;
}
/* One-time migration from the positional-id era (v0.2.1 and earlier).
   DECK order has never changed, so c<i> maps exactly onto DECK[i].id.
   Runs once; after it, lantern.v1 is left untouched as a safety net. */
function migrate(o){
  const s=blank();
  s.session=o.session||0; s.lesson=o.lesson||12;
  s.lastDate=o.lastDate||null; s.streak=o.streak||0;
  const map={};
  DECK.forEach((c,i)=>map["c"+i]=c.id);
  for(const k in (o.cards||{})){
    const id=map[k]; if(!id)continue;
    const st=o.cards[k];
    if(st && (st.seen||st.box||st.missed))s.cards[id]=st;
  }
  s.misses=(o.misses||[]).map(m=>({...m,id:map[m.id]||m.id})).filter(m=>m.id);
  s.prod=o.prod||{}; s.pmisses=o.pmisses||[]; s.prodRuns=o.prodRuns||0;
  s.homework=o.homework||blankHomework();
  return hydrate(s);
}
function load(){
  if(mem)return mem;
  try{
    const r=localStorage.getItem(KEY);
    if(r){mem=hydrate(JSON.parse(r));}
    else{
      const legacy=localStorage.getItem("lantern.v1");
      if(legacy){mem=migrate(JSON.parse(legacy));save();}
      else{mem=hydrate(blank());}
    }
  }catch(e){canPersist=false;mem=hydrate(blank());}
  return mem;
}
function save(){
  if(!canPersist)return;
  try{localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){canPersist=false;render();}
}
const NIL={box:0,due:0,seen:0,missed:0};
/* peek() never writes — use it for rendering so Home does not materialise
   a state row for all 142 cards merely by counting them. */
function peek(id){return load().cards[id]||NIL;}
function cs(id){const s=load();return s.cards[id]||(s.cards[id]={box:0,due:0,seen:0,missed:0});}
function pPeek(id){return load().prod[id]||{seen:0,missed:0};}

/* ---------------- scheduling ---------------- */
const STEPS=[1,2,4,8,16];
function pickSession(){
  const s=load(), lesson=s.lesson;
  const pool=DECK.filter(c=>!c.stretch);
  const scored=pool.map(c=>{
    const st=peek(c.id);
    const due=st.seen===0?9999:st.due;
    const overdue=st.seen===0?0:(s.session-st.due);
    return {c,st,fresh:st.seen===0,overdue,inLesson:c.l===lesson,due};
  });
  /* Due reviews may come from any lesson already seen.
     Fresh cards come ONLY from the selected lesson. If that leaves
     fewer than five, we serve a short session rather than importing
     unseen material the learner's class has not reached. */
  const dueNow=scored.filter(x=>!x.fresh && x.due<=s.session)
                     .sort((a,b)=>b.overdue-a.overdue);
  const freshLesson=scored.filter(x=>x.fresh && x.inLesson);
  const out=[], ids=new Set();
  const take=(arr,n)=>{
    for(const x of arr){
      if(out.length>=5||n<=0)break;
      if(ids.has(x.c.id))continue;
      ids.add(x.c.id);out.push(x.c);n--;
    }
  };
  take(dueNow,2); take(freshLesson,5); take(dueNow,5);
  return out;
}
/* Three previously-seen 词语 only. Never unseen vocabulary, never mixed
   card types — a production session is a single-modality session. */
function pickProduction(){
  const s=load();
  const cand=DECK.filter(c=>c.pool==="ci" && peek(c.id).seen>0);
  const missed=new Set(s.pmisses.map(m=>m.id));
  const rank=c=>missed.has(c.id)?0:(pPeek(c.id).seen===0?1:2);
  return cand.sort((a,b)=>rank(a)-rank(b)||pPeek(a.id).seen-pPeek(b.id).seen).slice(0,3);
}
/* Production grading touches prod/pmisses only. It must never advance
   recognition box, due, seen or missed. */
function gradeProd(card,ok,repair){
  const s=load(), p=s.prod[card.id]||(s.prod[card.id]={seen:0,missed:0});
  p.seen++;
  if(ok){s.pmisses=s.pmisses.filter(m=>m.id!==card.id);}
  else{p.missed++;if(!s.pmisses.some(m=>m.id===card.id))s.pmisses.unshift({id:card.id,n:s.prodRuns});}
  s.pmisses=s.pmisses.slice(0,60);
  save();
}
function grade(card,ok,reason,repair){
  const s=load(), st=cs(card.id);
  st.seen++;
  if(ok){
    st.box=Math.min(st.box+1,STEPS.length-1);st.due=s.session+STEPS[st.box];
    if(repair)s.misses=s.misses.filter(m=>m.id!==card.id);
  }
  else{
    st.box=0;st.due=s.session+1;st.missed++;
    s.misses.unshift({id:card.id,reason,n:s.session});
    s.misses=s.misses.slice(0,150);
  }
  save();
}

/* ---------------- homework sprint ----------------
   Worksheet content is deliberately local. A parent can turn a photo into
   five fields with Kimi/ChatGPT, then paste the rows here. No child data or
   worksheet image leaves this browser. Sprint evidence has its own clock and
   never inflates the nightly session or streak. */
const HW_STAGES=[
  {id:"flash",zh:"生字卡",en:"Flashcards"},
  {id:"charToPinyin",zh:"看字选音",en:"Character → pinyin"},
  {id:"pinyinToChar",zh:"看音选字",en:"Pinyin → character"},
  {id:"context",zh:"句中选字",en:"Fill the blank"},
  {id:"dictation",zh:"模拟听写",en:"Mock dictation"}
];
const HW_ASSESSED=HW_STAGES.filter(x=>x.id!=="flash");
function hashText(t){
  let h=2166136261;
  for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}
  return (h>>>0).toString(36).toUpperCase();
}
function homeworkDeck(id){
  if(!id)return null;
  return load().homework.decks.find(d=>d.id===id)||null;
}
function schoolHomeworkForLesson(lesson){
  return load().homework.decks.find(d=>d.source==="school"&&d.lesson===lesson)||null;
}
function activeHomework(){
  const s=load(),h=s.homework;
  const d=homeworkDeck(h.activeId)||schoolHomeworkForLesson(s.lesson)||h.decks.find(d=>d.source==="school")||h.decks[0]||null;
  if(d)d.items=(d.items||[]).map(x=>x.char?x:{...x,char:x.word});
  return d;
}
function lastHomeworkRun(deckId){return load().homework.runs.find(r=>r.deckId===deckId)||null;}
function homeworkRunScore(run){
  if(!run)return null;
  let got=0,total=0;
  HW_ASSESSED.forEach(st=>{got+=(run.scores&&run.scores[st.id])||0;total+=(run.totals&&run.totals[st.id])||0;});
  return {got,total};
}
function parseHomework(text,title){
  const rows=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(rows.length<2||rows.length>24)throw new Error("Use 2 to 24 tested characters.");
  const items=rows.map((row,i)=>{
    const p=row.split(/\t|\s*\|\s*/).map(x=>x.trim());
    if(p.length<4||p.slice(0,4).some(x=>!x))throw new Error(`Line ${i+1} needs character | pinyin | meaning | containing word.`);
    const [char,py,en,word,...rest]=p, sentence=rest.join(" | ");
    if([...char].length!==1)throw new Error(`Line ${i+1}: ${char} must be one tested character.`);
    if(!word.includes(char))throw new Error(`Line ${i+1}: ${word} must contain ${char}.`);
    if(sentence&&!sentence.includes(char))throw new Error(`Line ${i+1}: the sentence must contain ${char}.`);
    return {id:"HW-"+hashText([char,py,word,sentence].join("|")),char,py,en,word,sentence};
  });
  if(new Set(items.map(x=>x.id)).size!==items.length)throw new Error("The same worksheet row appears twice.");
  if(new Set(items.map(x=>x.char)).size!==items.length)throw new Error("Each tested character should appear only once.");
  const clean=(title||"本周听写").trim().slice(0,40)||"本周听写";
  return {id:"HWD-"+hashText(clean+"|"+items.map(x=>x.id).join("|")),title:clean,source:"custom",preloaded:false,createdAt:new Date().toISOString(),items};
}
function hwEvidence(itemId){
  const e=load().homework.evidence;
  return e[itemId]||(e[itemId]={flash:{seen:0,missed:0},charToPinyin:{seen:0,missed:0},pinyinToChar:{seen:0,missed:0},context:{seen:0,missed:0},dictation:{seen:0,missed:0}});
}
function gradeHomework(item,stage,ok){
  const all=hwEvidence(item.id),e=all[stage]||(all[stage]={seen:0,missed:0});e.seen++;if(!ok)e.missed++;
  /* Dictation is genuine production evidence when the worksheet word already
     exists in the canonical deck. Other sprint stages remain separate. */
  if(stage==="dictation"){
    const c=DECK.find(x=>x.pool==="ci"&&x.ans===item.word);
    if(c)gradeProd(c,ok,false);
  }
  save();
}
function shuffled(a){
  const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;
}
function blankSentence(item){return item.sentence.replace(item.char,"＿");}
function stageItems(stage,items){return stage.id==="context"?items.filter(x=>x.sentence):items;}
function newHomeworkRun(items,deckId){return{name:"homeworkRun",deckId:deckId||(activeHomework()&&activeHomework().id),items,stage:0,i:0,revealed:false,answered:false,options:{},missed:[],flashSeen:[],scores:{charToPinyin:0,pinyinToChar:0,context:0,dictation:0}};}
function sayWord(word){
  if(!("speechSynthesis" in window))return false;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang="zh-CN";u.rate=.72;speechSynthesis.speak(u);return true;
}

function session(s){
  const {q,i,revealed,marks,asking}=view;
  const c=q[i];
  setGlow(i);
  const pips=q.map((_,n)=>`<div class="pip ${marks[n]===true?"on":marks[n]===false?"miss":""}"></div>`).join("");
  /* Dictation inverts only 词语 cards: pinyin + English on the front, characters
     on the reveal. Production is the point here, so the usual no-pinyin-on-front
     rule does not apply — the character IS the answer being produced. */
  const dict=view.mode==="prod";
  const front=dict
    ? `<div class="prompt small mono" style="font-size:30px;letter-spacing:.04em">${esc(c.py)}</div>
       <div class="english" style="margin-top:8px">${esc(c.en)}</div>

    : c.pool==="zao"

  const revealBlock=revealed?`
    <div class="reveal">

  let controls;
  if(asking){
    controls=`
      <p class="eyebrow" style="text-align:center;margin:20px 0 6px">Why was it missed?</p>
      <button class="btn" data-r="meaning"><b>不懂意思</b><span>Didn't know what it means</span></button>
      <button class="btn" data-r="chars"><b>意思懂，字不会</b><span>Knew the meaning, not the characters</span></button>
      <button class="btn" data-r="use"><b>会字，用错了</b><span>Knew it, used it wrongly</span></button>
      <button class="btn" data-r="skip"><b>Skip</b><span>Just move on</span></button>`;
  }else if(revealed){
    controls=`<div class="row" style="margin-top:16px">
      <button class="btn ${dict?"btn-jade":"btn-lantern"}" id="ok"><b>${dict?"写对了 · Wrote it":"会 · Got it"}</b></button>
      <button class="btn miss-btn" id="${dict?"pno":"no"}"><b>${dict?"写错了 · Not yet":"不会 · Missed"}</b></button>
    </div>`;
  }else{
    controls=`<button class="btn" id="rev" style="margin-top:16px;text-align:center"><b>看答案 · Show</b></button>`;
  }

  app.innerHTML=`
    <div class="progress">${pips}</div>
    <div class="card">
      <div class="pool">${POOL_LABEL[c.pool]} · 第${c.l||"—"}课${dict?" · 写汉字":""}</div>
      ${front}
      ${revealBlock}
    </div>
    ${controls}
    <p class="tapline">${i+1} / ${q.length}</p>
    <button class="btn" id="quit" style="margin-top:20px;text-align:center"><span>End session</span></button>`;

  const $=id=>document.getElementById(id);
  if($("rev"))$("rev").onclick=()=>{view.revealed=true;render();};
  if($("ok"))$("ok").onclick=()=>{
    dict?gradeProd(c,true,view.repair):grade(c,true,null,view.repair);
    view.marks[i]=true;next();};
  if($("no"))$("no").onclick=()=>{view.marks[i]=false;view.asking=true;render();};
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    grade(c,false,b.dataset.r==="skip"?null:b.dataset.r);next();
  });
  if($("pno"))$("pno").onclick=()=>{gradeProd(c,false,view.repair);view.marks[i]=false;next();};
  $("quit").onclick=()=>go({name:"home"});

  function next(){
    if(i+1>=q.length){
      /* Production runs on its own clock: no session++, no streak, no
         effect on recognition scheduling. */
      if(view.mode==="prod"){
        const st=load();st.prodRuns++;save();
        go({name:"prodDone",words:q.map(x=>x.ans)});return;
      }
      /* A repair round is remedial: it must not inflate the nightly
         session count or the streak. */
      if(view.repair){save();go({name:"mistakes",repaired:true});return;}
      const st=load();
      st.session++;
      const midnight=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
      const today=midnight(new Date());
      if(!st.lastDate){st.streak=1;}
      else{
        const gap=Math.round((today-midnight(st.lastDate))/86400000);
        if(gap===1)st.streak++;
        else if(gap>1)st.streak=1;
      }
      st.lastDate=today.toDateString();save();
      go({name:"beat",words:q.filter(x=>x.pool!=="zao").map(x=>x.ans)});
    }else{view.i=i+1;view.revealed=false;view.asking=false;render();}
  }
}

  const schoolOptions=HW_SCHOOL_SEEDS.map(seed=>{
    const l=lessonOf(seed.lesson),deck=h.decks.find(x=>x.source==="school"&&x.lesson===seed.lesson);
    return `<option value="${esc(deck.id)}" ${deck.id===d.id?"selected":""}>${l.book} 第${l.id}课 ${esc(l.title)} · ${deck.items.length}字</option>`;
  }).join("");
  const customOptions=custom.length?`<optgroup label="Custom worksheets">${custom.map(x=>`<option value="${esc(x.id)}" ${x.id===d.id?"selected":""}>${esc(x.title)} · ${(x.items||[]).length}字</option>`).join("")}</optgroup>`:"";
  app.innerHTML=`
    <div class="panel" style="border-color:rgba(240,175,60,.4)">
      <p class="eyebrow">作业闯关 · Homework Sprint Library</p>
      <p class="zh" style="font-size:21px;margin:5px 0 10px">选一课，再闯关</p>
      <select id="hwl" aria-label="Choose homework sprint"><optgroup label="School worksheets">${schoolOptions}</optgroup>${customOptions}</select>
      <p class="dim" style="margin:10px 0 0">15 school worksheet decks · Lessons 1–9 and 12–17 · each keeps its own progress and repair trail.</p>
    </div>
    <div class="panel">
      <p class="big-zh" style="font-size:27px;line-height:1.45">${esc(d.title)}</p>
      <p class="dim" style="text-align:center">${d.items.length} tested characters · ${totalRuns} round${totalRuns===1?"":"s"}${score&&score.total?` · last ${score.got}/${score.total}`:""}</p>
      <div class="stage-rail">${HW_STAGES.map(()=>`<div class="stage-step on"></div>`).join("")}</div>
      <p class="zh" style="text-align:center;font-size:16px">生字卡 → 看字选音 → 看音选字 → 句中选字 → 模拟听写</p>
      <p class="dim" style="text-align:center">Each lesson keeps its own rounds, misses and repair trail.</p>
    </div>
    ${retry.length?`<button class="btn btn-lantern" id="retry"><b>先补弱项 · Retry misses</b><span>${retry.length} shaky character${retry.length===1?"":"s"} from this lesson's last round</span></button>`:""}
    <button class="btn ${retry.length?"":"btn-lantern"}" id="all"><b>完整闯关 · Full sprint</b><span>All ${d.items.length} characters through five stages</span></button>
    ${d.source!=="school"?`<button class="btn" id="edithw"><b>编辑自建作业 · Edit custom worksheet</b><span>Update this deck without touching the school library</span></button>`:""}
    <button class="btn" id="newhw"><b>家长添加 · Add custom worksheet</b><span>Paste another worksheet and keep every existing deck</span></button>
    <button class="btn" id="back" style="text-align:center"><span>Back</span></button>`;
  document.getElementById("hwl").onchange=e=>{h.activeId=e.target.value;save();render();};
  const start=items=>go(newHomeworkRun(items,d.id));
  const rb=document.getElementById("retry");if(rb)rb.onclick=()=>start(retry);
  document.getElementById("all").onclick=()=>start(d.items);
  const eb=document.getElementById("edithw");if(eb)eb.onclick=()=>go({name:"homeworkSetup",mode:"edit",editId:d.id});
  document.getElementById("newhw").onclick=()=>go({name:"homeworkSetup",mode:"new"});
  document.getElementById("back").onclick=()=>go({name:"home"});
}

function homeworkSetup(s){
  setGlow(0);
  const h=s.homework;
  const d=view.mode==="edit"?homeworkDeck(view.editId):null;
  if(d&&d.source==="school"){go({name:"homework"});return;}
  const rows=d?(d.items||[]).map(x=>[x.char,x.py,x.en,x.word].concat(x.sentence?[x.sentence]:[]).join(" | ")).join("\n"):"";
  app.innerHTML=`
    <div class="panel">
      <p class="eyebrow">Parent setup · Custom worksheet</p>
      <p class="zh" style="font-size:22px;margin:6px 0 2px">${d?"修改自建闯关":"添加新的闯关"}</p>
      <p class="dim">Paste extracted worksheet rows here. Saving adds this deck beside the school library; it never replaces another lesson. Nothing is uploaded.</p>
      <label class="eyebrow" for="ht">Deck name</label>
      <input id="ht" type="text" maxlength="40" value="${esc(d?d.title:"本周听写")}" style="margin:6px 0 14px">
      <label class="eyebrow" for="hr">Worksheet rows</label>
      <textarea id="hr" style="min-height:220px;margin-top:6px" placeholder="闹 | nào | to make a disturbance | 闹笑话 | 他常常因为粗心闹笑话。&#10;简 | jiǎn | simple | 简单 | 这道题真不简单。">${esc(rows)}</textarea>
      <p class="format-help">One character per line: <b>character | pinyin | meaning | containing word | homework sentence</b><br>The sentence is optional; only characters with one enter Fill the blank. Use 2–24 characters.</p>
      <div id="herr"></div>
      <button class="btn btn-lantern" id="savehw" style="text-align:center"><b>${d?"保存修改 · Save changes":"建立闯关 · Add sprint"}</b></button>
    </div>
    <button class="btn" id="cancel" style="text-align:center"><span>Cancel</span></button>`;
  document.getElementById("savehw").onclick=()=>{
    const box=document.getElementById("herr");
    try{
      const deck=parseHomework(document.getElementById("hr").value,document.getElementById("ht").value);
      if(d){deck.id=d.id;deck.createdAt=d.createdAt||deck.createdAt;deck.updatedAt=new Date().toISOString();}
      const idx=h.decks.findIndex(x=>x.id===deck.id);
      if(idx>=0)h.decks[idx]=deck;else h.decks.push(deck);
      h.activeId=deck.id;save();go({name:"homework"});
    }catch(e){box.innerHTML=`<p class="dim" style="color:var(--seal)">${esc(e.message)}</p>`;}
  };
  document.getElementById("cancel").onclick=()=>go({name:"homework"});
}

function homeworkRun(s){
  let stage=HW_STAGES[view.stage],items=stageItems(stage,view.items);
  while(!items.length&&view.stage+1<HW_STAGES.length){view.stage++;stage=HW_STAGES[view.stage];items=stageItems(stage,view.items);}
  const item=items[view.i],key=stage.id+":"+item.id;
  setGlow(Math.min(5,view.i+1));
  if(!view.options[key]&&(stage.id==="charToPinyin"||stage.id==="pinyinToChar"||stage.id==="context")){
    let pool=view.items.filter(x=>x.id!==item.id);
    if(stage.id==="charToPinyin"){
      const used=new Set([item.py]);
      pool=pool.filter(x=>{if(used.has(x.py))return false;used.add(x.py);return true;});
    }
    view.options[key]=shuffled([item,...shuffled(pool).slice(0,3)]);
  }
  const rail=HW_STAGES.map((_,i)=>`<div class="stage-step ${i<view.stage?"done":i===view.stage?"on":""}"></div>`).join("");
  let body="",controls="";
  if(stage.id==="flash"){
    body=`<div class="prompt zh">${esc(item.char)}</div>${view.revealed?`<div class="reveal"><div class="pinyin">${esc(item.py)}</div><div class="english">${esc(item.en)}</div><div class="tip zh">词语：${esc(item.word)}</div></div>`:`<div class="tip">Tap the card to reveal pinyin, meaning and its word.</div>`}`;
    controls=`<div class="row" style="margin-top:16px"><button class="btn" id="hwprev"><b>← Previous</b></button><button class="btn" id="hwnav"><b>Next →</b></button></div>
      <button class="btn" id="hwshuffle" style="text-align:center"><span>洗牌 · Shuffle cards</span></button>
      <button class="btn btn-lantern" id="hwcontinue" style="text-align:center"><b>开始小测验 · Start quiz</b><span>${view.flashSeen.length} of ${items.length} revealed</span></button>`;
  }else if(stage.id==="charToPinyin"){
    body=`<div class="prompt zh">${esc(item.char)}</div><div class="tip zh">${esc(item.word)}</div><div class="english">Choose the correct pinyin</div>`;
    controls=choiceButtons(item);
  }else if(stage.id==="pinyinToChar"){
    body=`<div class="prompt small mono" style="font-size:34px">${esc(item.py)}</div><div class="english">${esc(item.en)}</div><div class="tip zh">词语：${esc(item.word)}</div>`;
    controls=choiceButtons(item);
  }else if(stage.id==="context"){
    body=`<div class="prompt small zh">${esc(blankSentence(item))}</div><div class="english">Choose the character that fills the blank</div>`;
    controls=choiceButtons(item);
  }else{
    const revealHtml=view.revealed
      ? `<div class="reveal"><div class="answer zh">${esc(item.word)}</div><div class="pinyin">本课生字：${esc(item.char)} · ${esc(item.py)}</div></div>`
      : `<div class="tip">听词语，在纸上写出来。不要先看拼音。</div>`;
    body=`<button class="btn btn-jade" id="speak" style="text-align:center;margin:0"><b>🔊 听一听 · Play word</b><span>Listen, then write the word on paper</span></button>${revealHtml}`;
    controls=view.revealed?selfGrade("写对了 · Correct","再练 · Not yet"):`<button class="btn" id="reveal" style="text-align:center"><b>看答案 · Check</b></button>`;
  }
  app.innerHTML=`
    <div class="stage-rail">${rail}</div>
    <p class="eyebrow stage-name">${view.stage+1}/${HW_STAGES.length} · ${stage.zh} · ${stage.en}</p>
    <div class="card" id="hwcard"><div class="pool">${stage.id==="flash"?"Card":"Question"} ${view.i+1} / ${items.length}</div>${body}</div>
    ${controls}
    <button class="btn" id="quit" style="margin-top:20px;text-align:center"><span>End sprint</span></button>`;
  const reveal=document.getElementById("reveal");if(reveal)reveal.onclick=()=>{view.revealed=true;render();};
  if(stage.id==="flash"){
    const show=()=>{if(!view.flashSeen.includes(item.id)){view.flashSeen.push(item.id);gradeHomework(item,"flash",true);}view.revealed=true;render();};
    document.getElementById("hwcard").onclick=show;
    document.getElementById("hwprev").onclick=e=>{e.stopPropagation();if(view.i>0){view.i--;view.revealed=false;render();}};
    document.getElementById("hwnav").onclick=e=>{e.stopPropagation();if(view.i+1<items.length){view.i++;view.revealed=false;render();}};
    document.getElementById("hwshuffle").onclick=e=>{e.stopPropagation();view.items=shuffled(view.items);view.i=0;view.revealed=false;view.options={};render();};
    document.getElementById("hwcontinue").onclick=e=>{e.stopPropagation();view.stage=1;view.i=0;view.revealed=false;render();};
  }
  const speak=document.getElementById("speak");if(speak)speak.onclick=()=>{if(!sayWord(item.word))alert("Audio is not available in this browser. Ask Appa to read the word.");};
  app.querySelectorAll("[data-hw-ok]").forEach(b=>b.onclick=()=>answer(b.dataset.hwOk==="1"));
  app.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{
    if(view.answered)return;const ok=b.dataset.choice===item.id;view.answered=true;view.chosen=b.dataset.choice;answer(ok,true);
  });
  const next=document.getElementById("hwnext");if(next)next.onclick=advance;
  document.getElementById("quit").onclick=()=>go({name:"homework"});

  function selfGrade(yes,no){return `<div class="row" style="margin-top:16px"><button class="btn btn-lantern" data-hw-ok="1"><b>${yes}</b></button><button class="btn miss-btn" data-hw-ok="0"><b>${no}</b></button></div>`;}
  function choiceButtons(correct){
    const buttons=view.options[key].map(x=>{
      const cls=view.answered?(x.id===correct.id?"good":x.id===view.chosen?"bad":""):"";
      const label=stage.id==="charToPinyin"?x.py:x.char;
      return `<button class="btn choice ${cls}" data-choice="${esc(x.id)}"><b class="${stage.id==="charToPinyin"?"mono":"zh"}">${esc(label)}</b></button>`;
    }).join("");
    return `<div class="choices">${buttons}</div>${view.answered?`<button class="btn btn-lantern" id="hwnext" style="text-align:center"><b>${view.chosen===correct.id?"答对了 · Next":"记住它 · Next"}</b></button>`:""}`;
  }
  function answer(ok,defer){
    gradeHomework(item,stage.id,ok);if(ok)view.scores[stage.id]++;
    if(!ok&&!view.missed.includes(item.id))view.missed.push(item.id);
    if(defer){render();return;}advance();
  }
  function advance(){
    if(view.i+1<items.length){view.i++;view.revealed=false;view.answered=false;view.chosen=null;render();return;}
    if(view.stage+1<HW_STAGES.length){view.stage++;view.i=0;view.revealed=false;view.answered=false;view.chosen=null;render();return;}
    const h=load().homework,d=homeworkDeck(view.deckId)||activeHomework();
    const totals={charToPinyin:view.items.length,pinyinToChar:view.items.length,context:view.items.filter(x=>x.sentence).length,dictation:view.items.length};
    h.runs.unshift({deckId:d.id,at:new Date().toISOString(),count:view.items.length,missed:[...view.missed],scores:{...view.scores},totals});
    h.runs=h.runs.slice(0,120);
    if(view.items.some(x=>DECK.some(c=>c.pool==="ci"&&c.ans===x.word)))load().prodRuns++;
    save();go({name:"homeworkDone",deckId:d.id,count:view.items.length,missed:[...view.missed],scores:{...view.scores},totals});
  }
}

function homeworkDone(s){
  setGlow(5);const n=view.count,m=view.missed.length;
  app.innerHTML=`
    <div class="panel" style="text-align:center;border-color:rgba(111,160,137,.5)">
      <p class="eyebrow" style="color:var(--jade)">闯关完成 · Sprint complete</p>
      <p class="big-zh" style="font-size:29px;line-height:1.45;color:var(--jade)">${m?`找到 ${m} 个要再练的字`:"全部点亮了"}</p>
      <p class="dim">${m?"The repair round contains only these shaky characters.":"All assessed stages were clear this round."}</p>
      <div class="score-grid">${HW_ASSESSED.filter(x=>(view.totals[x.id]||0)>0).map(x=>`<div class="score-cell"><b>${view.scores[x.id]}/${view.totals[x.id]}</b><span class="dim">${x.en}</span></div>`).join("")}</div>
    </div>
    ${m?`<button class="btn btn-lantern" id="again"><b>马上补一补 · Focused repair</b><span>${m} character${m===1?"":"s"} through the mastery path again</span></button>`:""}
    <button class="btn" id="done" style="text-align:center"><span>Back to Homework Library</span></button>`;
  const again=document.getElementById("again");if(again)again.onclick=()=>{
    const ids=new Set(view.missed),d=homeworkDeck(view.deckId)||activeHomework(),items=d.items.filter(x=>ids.has(x.id));
    go(newHomeworkRun(items,d.id));
  };
  document.getElementById("done").onclick=()=>go({name:"homework"});
}

const APP_VERSION="0.5.1", SCHEMA_VERSION=2;

function isLegacy(o){return o&&o.cards&&Object.keys(o.cards).some(k=>/^c\d+$/.test(k));}

/* Accepts: wrapped backup envelope, raw v2 state, or legacy positional v1. */
function readBackup(text){
  const j=JSON.parse(text);
  const st=(j&&j.format==="little-lantern-backup"&&j.state)?j.state:j;
  if(!st||typeof st!=="object"||typeof st.cards!=="object")throw new Error("not a Lantern backup");
  return isLegacy(st)?migrate(st):hydrate(st);
}
function summarise(st){
  const learned=Object.values(st.cards||{}).filter(c=>c.seen>0).length;
  const written=Object.keys(st.prod||{}).length;
  return `Session ${st.session||0} · ${st.streak||0}-day streak · Lesson ${st.lesson||"?"} · `
       + `${learned} learned card${learned===1?"":"s"}`+(written?` · ${written} written`:"");
}

function data(s){
  setGlow(0);
  app.innerHTML=`
    <div class="panel">
      <p class="eyebrow">Back up my cards</p>
      <p class="dim">Downloads a file holding her whole history — progress, misses, writing and scheduling. Keep it somewhere that isn't this phone.</p>
      <button class="btn btn-lantern" id="dl" style="text-align:center;margin-top:10px"><b>Back up my cards</b><span>${summarise(s)}</span></button>
    </div>
    <div class="panel">
      <p class="eyebrow">Restore from backup</p>
      <p class="dim">Choose a backup file. Nothing changes until you confirm.</p>
      <input type="file" id="file" accept="application/json,.json" style="margin-top:10px">
      <div id="preview"></div>
    </div>
    <div class="panel">
      <p class="eyebrow">Manual copy · advanced</p>
      <textarea id="dump" readonly>${esc(JSON.stringify(load()))}</textarea>
      <button class="btn" id="copy" style="text-align:center;margin-top:8px"><span>Copy text</span></button>
      <textarea id="in" placeholder="Paste a backup here" style="margin-top:10px"></textarea>
      <button class="btn" id="rest" style="text-align:center;margin-top:8px"><span>Restore from pasted text</span></button>
    </div>
    ${canPersist?"":`<p class="dim">This browser is blocking storage, so progress will vanish when the tab closes.</p>`}
    <button class="btn" id="back" style="text-align:center"><span>Back</span></button>`;

  document.getElementById("dl").onclick=()=>{
    const payload={format:"little-lantern-backup",backupVersion:1,schemaVersion:SCHEMA_VERSION,
                   appVersion:APP_VERSION,exportedAt:new Date().toISOString(),state:load()};
    const d=new Date(), pad=n=>String(n).padStart(2,"0");
    const name=`little-lantern-backup-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
    const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));
    const a=document.createElement("a");a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  };

  /* Parse and preview first. Current state is untouched until confirm,
     and a pre-restore snapshot is kept even then. */
  function offer(text){
    const box=document.getElementById("preview");
    let st;
    try{st=readBackup(text);}
    catch(e){box.innerHTML=`<p class="dim" style="color:var(--seal)">That file couldn't be read as a Lantern backup. Nothing has changed.</p>`;return;}
    box.innerHTML=`
      <div class="panel" style="border-color:rgba(240,175,60,.45);margin-top:12px">
        <p class="eyebrow">Restore this backup?</p>
        <p class="zh" style="margin:6px 0 0">${esc(summarise(st))}</p>
        <p class="dim">This replaces what's on the phone now. The current state is kept as a snapshot first.</p>
        <div class="row" style="margin-top:10px">
          <button class="btn btn-lantern" id="yes"><b>Restore</b></button>
          <button class="btn" id="nope"><b>Cancel</b></button>
        </div>
      </div>`;
    document.getElementById("yes").onclick=()=>{
      try{localStorage.setItem("lantern.v2.presnapshot",JSON.stringify(load()));}catch(e){}
      mem=st;save();go({name:"home"});
    };
    document.getElementById("nope").onclick=()=>{box.innerHTML="";};
  }

  document.getElementById("file").onchange=e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>offer(String(r.result));r.readAsText(f);
  };
  document.getElementById("copy").onclick=()=>{
    const t=document.getElementById("dump");t.select();
    try{document.execCommand("copy");document.getElementById("copy").innerHTML="<span>Copied</span>";}catch(e){}
  };
  document.getElementById("rest").onclick=()=>offer(document.getElementById("in").value);
  document.getElementById("back").onclick=()=>go({name:"home"});
}

render();
</script>
